name: Junomedical
description: >-
  Junomedical (now Qunomedical) is a Berlin-based digital health company founded
  in 2015 by Dr. Sophie Chung that connects patients with professionally-vetted
  doctors and clinics for high-quality medical treatments at home and abroad.
  The consumer platform (qunomedical.com) offers free assessments, price matching,
  24/7 patient support, and personalized treatment matching across specialties
  including plastic surgery, hair transplants, dentistry, oncology, orthopedics,
  reproductive medicine, and weight-loss surgery, serving roughly 10,000 patients
  a month. The company also builds Qunosuite, a patient-relationship-management
  (PRM) SaaS for healthcare providers. This profile was surfaced as a 500 Global
  portfolio company and added to the API Evangelist network; the company operates
  a consumer marketplace and a provider SaaS but publishes no public developer API,
  OpenAPI specification, or SDKs at this time.
